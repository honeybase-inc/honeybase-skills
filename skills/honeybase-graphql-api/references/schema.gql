  updateProcessSettings(processId: Long!, settings: ProcessSettingsInput!): ProcessData
  "Declare an endpoint's request/response contract, or clear it by passing null. Each half is an optional JSON Schema (the same subset Agent tools use). The request half is ENFORCED: a call whose body does not match is refused with 400 before the workflow runs. The response half is observed and counted, never enforced, so a schema edit cannot break live traffic. Endpoints only; unversioned, so re-releasing the workflow never changes it."
  updateEndpointContract(processId: Long!, contract: String): ProcessData
  "Set the paused state of a process"
  setProcessPaused(processId: Long!, paused: Boolean!): ProcessData
  "Make an endpoint callable WITHOUT a login at POST /api/public/endpoints/<token> (for static sites), rotate that token, set the browser origins allowed to call it, or revoke it. Off by default. Anyone holding the token can call the endpoint, so return only what a stranger may see. Requires canManageReleases and canBuildWorkflows. Returns the resulting state, or null when the endpoint is not public."
  setEndpointPublicAccess(processPublicId: String!, "true = make the endpoint public (mints a token if it has none; an already-public endpoint keeps its token). false = revoke: the URL stops working immediately. Cannot be combined with rotate, allowedOrigins or allowAnyOrigin." enabled: Boolean, "true = replace the token; the previous URL stops working immediately. Only on an endpoint that is already public, unless enabled: true is sent too (a rotation never makes an endpoint public)." rotate: Boolean, "REPLACES the origins (exact scheme://host[:port], e.g. https://example.com) whose browser pages may call the endpoint. A request carrying any other Origin header is refused with 403 before the workflow runs; requests without an Origin (servers, curl) are allowed. [] = no browser page may call (the default when public access is first enabled). At most 20. Cannot be combined with allowAnyOrigin: true." allowedOrigins: [String!], "true = ANY website may call the endpoint from a visitor's browser (any Origin, including 'null'), so any page can make a visitor's browser trigger it. false = only allowedOrigins (none if it is omitted). Omitted = unchanged." allowAnyOrigin: Boolean): EndpointPublicAccessGql
  "Generate (or regenerate) an API key for a webhook; returns the plaintext key once"
  generateWebhookApiKey(webhookId: Long!): String
  "Manually run a process now through one of its trigger nodes. Authenticated by the caller's session and bypasses the paused state (pause only gates automated webhook/schedule triggers); records run history with a Manual source."
  runProcess(processId: Long!, triggerNodeName: String!, payload: String): Boolean
  "Confirm an MCP run authorization request and start the run under the caller's own session. Requires the session of the user who was asked; single-use (a second confirm is rejected as already answered), rejected once the 30-minute window has passed. Same permission (canBuildWorkflows), same Manual source and same run-history row as runProcess. Returns the updated preview with runWorkflowId set, or with status failed and a failureReason when the run could not start."
  confirmRunAuthorization(publicId: String!, "Also record a standing approval for MCP runs (\"Approve always\"): from then on, request_run_authorization starts the run immediately for this user instead of minting a link. Personal, revocable from the Standing approvals list, never widens permissions." alwaysAllow: Boolean): RunAuthorizationPreview
  "Decline an MCP run authorization request. Requires the session of the user who was asked; nothing runs and the assistant polling get_run_authorization sees status declined."
  declineRunAuthorization(publicId: String!): RunAuthorizationPreview
  "Confirm an MCP action authorization request and perform the action under the caller's own session, through the same executor Barry uses (every check re-runs). Requires the session of the user who was asked; single-use; rejected after the 30-minute window. Returns the updated preview (status confirmed, or failed with a failureReason)."
  confirmActionAuthorization(publicId: String!, "Also record a standing approval for THIS tool over MCP (\"Confirm and always allow\"): from then on the assistant's request for it runs immediately for this user. Personal, revocable from the Standing approvals list, never widens permissions." alwaysAllow: Boolean): ActionAuthorizationPreview
  "Decline an MCP action authorization request. Requires the session of the user who was asked; nothing happens and the assistant polling get_action_authorization sees status declined."
  declineActionAuthorization(publicId: String!): ActionAuthorizationPreview
  "Cancel a run: a queued run is dropped before it executes; a running run stops at the next node boundary."
  cancelRun(runWorkflowId: Long!): Boolean
  "Cancel an in-memory (editor test) run by its run UUID; it stops at the next node boundary. These runs have no run history row, so they cannot be cancelled through cancelRun."
  cancelInMemoryRun(runId: String!): Boolean
  "Mint a short-lived signed download URL for a file produced by a workflow node. Takes the `id` from the file reference in a node's output. Org-scoped: holding a reference is not authority to read the file, so the URL is minted per request for an authenticated member of the owning organization and is never stored in run state, the run cache, or an AI context."
  workflowFileDownloadUrl(publicId: String!, source: String, inline: Boolean): String
  "Sign a direct browser upload of a file for use in workflows, and record it pending. The browser POSTs the bytes straight to the bucket with the returned fields (the `file` part last) and then calls `commitWorkflowFileUpload` with the returned public id. Requires canBuildWorkflows; the file counts against the organization's storage quota and is reaped on the same 30-day clock as files produced by runs."
  requestWorkflowFileUploadUrl(fileName: String!, contentType: String!, declaredSize: Long!): WorkflowFileUploadTicket
  "Verify an uploaded file landed and mark it committed, returning the file reference to use in expressions. The size declared when the upload was requested is a client claim; this checks the real object size."
  commitWorkflowFileUpload(publicId: String!): String
  "Suggest a CSV dialect (delimiter, charset) by sampling the start of an uploaded file. A suggestion only — it pre-fills the editor's dialect form, and what is saved on the node is what runs. Returns null when nothing can be inferred confidently. Org-scoped like every other file read."
  detectCsvDialect(publicId: String!): String
