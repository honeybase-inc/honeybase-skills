type AgentMutations {
  "Create an agent with an empty draft version"
  createAgent(name: String!, description: String!): AgentData
  "Update agent identity and monthly budget (USD)"
  updateAgent(agentId: Long!, name: String!, description: String!, "Monthly budget in USD (estimated spend, calendar month UTC); null = unlimited" monthlyBudgetUsd: Float, budgetNotifyUserIds: [Long!], budgetNotifyEmails: String): Agent
  "Update the agent's draft version (prompt, connection, model, settings)"
  updateAgentDraft(agentId: Long!, systemPrompt: String!, integrationId: Long, model: String!, "AgentSettings JSON (tool refs, brakes, structured output)" settings: String!): AgentData
  "Stamp the draft as the next release and clone a fresh draft. Also requires canManageReleases."
  releaseAgent(agentId: Long!): AgentData
  "Pause/unpause an agent (paused agents refuse runs)"
  setAgentPaused(agentId: Long!, paused: Boolean!): Agent
  "Turn the draft's \"Upload to any site without asking\" waiver on or off for web_interact uploads. Turning it on is refused for API keys and AI copilots: only a signed-in person in the app can accept it, and the server records who and when. Applies at the next release, like every draft setting."
  setAgentUploadAnySite(agentId: Long!, enabled: Boolean!): AgentData
  "Allow apps that declare this agent to invoke it. Requires canManageAgents AND canManageReleases, and a released version: agent tools run with the agent's authority, so this hands that authority to every user of every app that declares it"
  setAgentAppInvocable(agentId: Long!, appInvocable: Boolean!): Agent
  "Delete an agent, its versions, sessions and run history"
  deleteAgent(agentId: Long!): Boolean
  "Teach the agent something by hand (an agent- or process-scoped memory with no source task). Requires canManageAgents; refused for an API key - memory is written only under a person's session."
  createAgentMemory(agentId: Long!, "Agent (every task run) or Process (one process's tasks)" scope: String!, "Required when scope is Process; ignored otherwise" processId: Long, text: String!): AgentMemory
  "Edit a memory's text, scope or active flag. Requires canManageAgents."
  updateAgentMemory(agentMemoryId: Long!, scope: String!, processId: Long, text: String!, "An inactive memory is kept but no longer injected" active: Boolean!): AgentMemory
  "Forget a memory. Requires canManageAgents."
  deleteAgentMemory(agentMemoryId: Long!): Boolean
  "Set the org-wide monthly agent budget in USD across all agents (null = unlimited)"
  setOrgAgentBudget("Org-wide monthly agent budget in USD (estimated spend); null = unlimited" monthlyBudgetUsd: Float): Boolean
  "Send a test-chat message: runs the DRAFT version (streams via watchAgentRun)"
  startTestChatTurn(agentId: Long!, content: String!): TestChatTurn
  "Approve / reject-with-message / edit-args-then-approve a pending tool call"
  respondToAgentToolCall(agentRunId: Long!, toolCallId: String!, approved: Boolean!, "Shown to the model on rejection so it adapts" message: String, "Edited arguments JSON (edit-args-then-approve)" editedArgs: String, "Upload approvals only: also add the card's destination site to the agent's upload sites (draft and live release), so later uploads there run under the tool's normal policy. Requires agent-management permission; ignored on rejections." allowUploadSite: Boolean): Boolean
  "Stop an in-flight agent run"
  cancelAgentRun(agentRunId: Long!): Boolean
  "Close the caller's test session; the next turn starts fresh"
  resetTestSession(agentId: Long!): Boolean
  "Generate or rotate the agent's external API key (the credential for its per-agent MCP endpoint). Returns the plaintext key ONCE; rotating invalidates the previous key immediately. Requires a released version."
  generateAgentExternalKey(agentId: Long!): String
  "Clear the agent's external API key: the endpoint 401s every request until a new key is generated"
  revokeAgentExternalKey(agentId: Long!): Boolean
}

